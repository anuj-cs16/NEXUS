# NEXUS Development Docker Compose
# Orchestrates the sandbox container for development.

services:
  # Code execution sandbox
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    container_name: nexus-sandbox
    read_only: true
    tmpfs:
      - /tmp:size=512M
      - /run:size=64M
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "4"
          pids: 256
    network_mode: none
    volumes:
      - type: bind
        source: ../workspace
        target: /workspace
        read_only: false
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
